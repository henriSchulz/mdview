<!doctype html>
<html lang="de" data-mode="light">
<meta charset="utf-8">

<title>iPad lab 2</title>
<!-- Phase 2 der iPad-Gestaltung: Craft (Ansatz 1 aus ipad-lab.html) ohne Seitenleiste — nur der Knopf aus vier
     Teilen (aus Ansatz 6, Fokus) führt zu Alle Notizen. Drei Varianten, die sich darin unterscheiden, wie man sich
     bewegt: 1 Zoom (Knopf zoomt die Notiz in ihre Kachel, Ordner als Kachelreihe), 2 Schnellwahl (Halten auf dem Knopf,
     Regale je Ordner), 3 Stapel (Zusammenkneifen live, Ordner als Stapel zum Auffächern).
     Tasten: 1–3, T hell/dunkel, O Ausrichtung, F Vollbild, Esc. Nicht ausgeliefert. -->
<link rel="stylesheet" href="../motion.css">
<style>
  :root {
    --bg: #f5f5f7; --fg: #1d1d1f; --accent: #0071e3;
    --c-red: #d70015; --c-orange: #c93400; --c-yellow: #a05a00; --c-green: #248a3d;
    --c-cyan: #0071a4; --c-blue: #0071e3; --c-magenta: #8944ab;
    --paper: #fff;
    --ui: "SF Pro", "SF Pro Text", -apple-system, system-ui, "Inter", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    --fg2: color-mix(in srgb, var(--fg) 65%, transparent);
    --fg3: color-mix(in srgb, var(--fg) 42%, transparent);
    --line: color-mix(in srgb, var(--fg) 10%, transparent);
    --line-strong: color-mix(in srgb, var(--fg) 18%, transparent);
    --fill-hover: color-mix(in srgb, var(--fg) var(--hover-alpha), transparent);
    --fill-pressed: color-mix(in srgb, var(--fg) var(--pressed-alpha), transparent);
    --fill-quiet: color-mix(in srgb, var(--fg) 4%, transparent);
    --code-bg: color-mix(in srgb, var(--fg) 3.5%, var(--paper));
    --ground: color-mix(in srgb, var(--fg) 5%, var(--bg));
    --glass: color-mix(in srgb, var(--paper) 70%, transparent);
    --glass-strong: color-mix(in srgb, var(--paper) 86%, transparent);
    --glass-filter: blur(24px) saturate(180%);
    --float: 0 0 0 0.5px var(--line), 0 2px 12px rgb(0 0 0 / 0.08);
    --shadow-menu: 0 0 0 0.5px var(--line-strong), inset 0 0.5px 0 rgb(255 255 255 / 0.6), 0 12px 40px rgb(0 0 0 / 0.16);
    --shadow-lift: 0 0 0 0.5px var(--line), 0 18px 50px rgb(0 0 0 / 0.22);
    --scrim: rgb(0 0 0 / 0.16);
    --ink-on-accent: #fff;
    color-scheme: light;
  }
  html[data-mode="dark"] {
    --bg: #1e1e20; --fg: #f5f5f7; --accent: #0a84ff;
    --c-red: #ff453a; --c-orange: #ff9f0a; --c-yellow: #ffd60a; --c-green: #32d74b;
    --c-cyan: #64d2ff; --c-blue: #0a84ff; --c-magenta: #bf5af2;
    --paper: #2a2a2d;
    --ground: color-mix(in srgb, #000 35%, var(--bg));
    --glass: color-mix(in srgb, #3a3a3e 66%, transparent);
    --glass-strong: color-mix(in srgb, #3a3a3e 86%, transparent);
    --float: 0 0 0 0.5px rgb(255 255 255 / 0.1), 0 2px 12px rgb(0 0 0 / 0.4);
    --shadow-menu: 0 0 0 0.5px rgb(255 255 255 / 0.14), inset 0 0.5px 0 rgb(255 255 255 / 0.1), 0 12px 40px rgb(0 0 0 / 0.55);
    --shadow-lift: 0 0 0 0.5px rgb(255 255 255 / 0.12), 0 18px 50px rgb(0 0 0 / 0.6);
    --scrim: rgb(0 0 0 / 0.38);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; font: 400 14px/1.45 var(--ui); color: var(--fg); background: color-mix(in srgb, var(--fg) 9%, var(--bg)); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  svg.i .f { fill: currentColor; stroke: none; }

  /* ---------- the lab around the device ---------- */
  .lab-head { position: fixed; z-index: 100; top: 0; left: 0; right: 0; padding: 10px 16px 8px; display: grid; gap: 6px; background: color-mix(in srgb, var(--fg) 9%, var(--bg)); }
  .lab-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .lab-row h1 { margin: 0 6px 0 0; font-size: 16px; font-weight: 700; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill-hover); }
  .seg button { min-height: 30px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; font-size: 13px; cursor: default; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out); }
  .seg button b { font-weight: 600; margin-right: 5px; opacity: 0.55; }
  .seg button[aria-pressed="true"] { background: var(--paper); box-shadow: 0 0 0 0.5px var(--line-strong), 0 1px 2px rgb(0 0 0 / 0.08); }
  .seg button[aria-pressed="true"] b { opacity: 1; }
  .lab-idea { margin: 0; color: var(--fg2); font-size: 13px; min-height: 19px; }
  .lab-idea b { color: var(--fg); }
  .stage { position: fixed; left: 0; right: 0; bottom: 0; display: grid; place-items: center; }
  .fit { position: relative; }
  .dev { position: absolute; left: 0; top: 0; padding: 14px; border-radius: 50px; background: #0d0d0f; box-shadow: 0 0 0 1.5px #2c2c30, 0 30px 80px rgb(0 0 0 / 0.25); transform-origin: 0 0; }
  body.fill .lab-head { transform: translateY(-100%); transition: transform var(--dur-base) var(--ease-out); box-shadow: 0 6px 20px rgb(0 0 0 / 0.15); }
  body.fill.head .lab-head { transform: none; }
  body.fill .stage { inset: 0; display: block; }
  body.fill .fit { width: 100% !important; height: 100% !important; }
  body.fill .dev { position: static; width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; transform: none !important; background: none; }
  .pull { display: none; position: fixed; z-index: 101; top: 0; left: 50%; translate: -50% 0; width: 64px; height: 18px; border: 0; border-radius: 0 0 9px 9px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
  body.fill .pull { display: block; }

  /* ---------- the screen ---------- */
  .scr { position: relative; overflow: hidden; border-radius: 36px; background: var(--ground); font: 400 15.5px/1.5 var(--ui); color: var(--fg); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; isolation: isolate; --safe: 24px; }
  body.fill .scr { border-radius: 0; --safe: 0px; }
  .status { position: absolute; z-index: 80; top: 0; left: 26px; right: 26px; height: 24px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; pointer-events: none; }
  .status span:nth-child(2) { font-weight: 500; }
  .status .bat { margin-left: auto; width: 25px; height: 12px; border-radius: 4px; border: 1.2px solid currentColor; padding: 1.5px; opacity: 0.85; }
  .status .bat::after { content: ""; display: block; height: 100%; width: 88%; border-radius: 2px; background: currentColor; }
  body.fill .status { display: none; }
  .view { position: absolute; inset: 0; }
  .ground { position: absolute; inset: 0; transition: background var(--dur-slow) var(--ease-out); }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .scroller::-webkit-scrollbar { display: none; }

  /* the ground around the note: the property `background` */
  .scr[data-bg="none"] .ground { background: var(--paper); }
  .scr[data-bg="gray"] .ground { background: var(--ground); }
  .scr[data-bg="blue"] .ground { background: linear-gradient(160deg, color-mix(in srgb, var(--c-blue) 30%, var(--bg)), color-mix(in srgb, var(--c-cyan) 30%, var(--bg))); }
  .scr[data-bg="green"] .ground { background: linear-gradient(160deg, color-mix(in srgb, var(--c-green) 28%, var(--bg)), color-mix(in srgb, var(--c-yellow) 26%, var(--bg))); }
  .scr[data-bg="magenta"] .ground { background: linear-gradient(160deg, color-mix(in srgb, var(--c-magenta) 28%, var(--bg)), color-mix(in srgb, var(--c-red) 24%, var(--bg))); }
  .scr[data-bg="dots"] .ground { background: radial-gradient(circle, color-mix(in srgb, var(--fg) 20%, transparent) 1.1px, transparent 1.6px) 0 0 / 22px 22px, var(--ground); }
  .scr[data-bg="grid"] .ground { background: linear-gradient(color-mix(in srgb, var(--fg) 8%, transparent) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, color-mix(in srgb, var(--fg) 8%, transparent) 1px, transparent 1px) 0 0 / 24px 24px, var(--ground); }
  .scr[data-bg="lines"] .ground { background: linear-gradient(transparent 27px, color-mix(in srgb, var(--fg) 9%, transparent) 27px) 0 0 / 100% 28px, var(--ground); }

  /* the sheet and the note in it */
  .sheet { position: relative; width: var(--sheet-w); margin: calc(var(--safe) + var(--top-gap, 76px)) auto 150px; padding: 30px 36px 70px 36px; border-radius: 22px; background: var(--paper); box-shadow: 0 0 0 0.5px var(--line), 0 1px 4px rgb(0 0 0 / 0.04); transition: width var(--spring-smooth-dur) var(--spring-smooth), transform var(--spring-smooth-dur) var(--spring-smooth); font-size: var(--ts, 15.5px); }
  .scr[data-bg="none"] .sheet { background: transparent; box-shadow: none; }
  .doc-head h1 { margin: 0; font-size: 1.85em; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
  .doc-head .folder { display: flex; align-items: center; gap: 6px; margin: 6px 0 0; color: var(--fg2); font-size: 13px; }
  .doc-head .folder svg { width: 15px; height: 15px; }
  .doc-head { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 0.5px solid var(--line); }
  .note h2 { margin: 0; padding: 6px 0 4px; font-size: 1.35em; font-weight: 700; line-height: 1.3; }
  .note h3 { margin: 0; padding: 14px 0 4px; font-size: 1.1em; font-weight: 600; }
  .note p { margin: 0; padding: 4px 0; }
  .note ul { margin: 0; padding: 0 0 0 22px; }
  .note li { padding: 3px 0; }
  .note li.task { list-style: none; position: relative; }
  .note li.task .cb { position: absolute; left: -22px; top: 8px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--fg3); }
  .note li.task.ticked { color: var(--fg2); text-decoration: line-through; text-decoration-color: var(--fg3); }
  .note li.task.ticked .cb { background: var(--accent); border-color: var(--accent); }
  .note hr.blk { border: 0; height: 22px; margin: 6px 0; background: linear-gradient(var(--line-strong), var(--line-strong)) 0 50% / 100% 1px no-repeat; }
  .note code { font-family: var(--mono); font-size: 0.86em; padding: 1px 5px; border-radius: 5px; background: var(--code-bg); border: 0.5px solid var(--line); }
  .note .code { display: grid; grid-template-columns: 34px 1fr; margin: 4px 0; padding: 10px 0; border-radius: 9px; background: var(--code-bg); border: 0.5px solid var(--line); font: 13px/1.6 var(--mono); }
  .note .code .ln { color: var(--fg3); text-align: right; padding-right: 10px; white-space: pre; }
  .note .code .src { white-space: pre-wrap; word-break: break-all; padding-right: 14px; }
  .note .code .kw { color: var(--c-green); }
  .note .callout { margin: 8px 0; padding: 10px 14px 10px 16px; border-radius: 10px; background: color-mix(in srgb, var(--c-green) 9%, var(--paper)); box-shadow: inset 3px 0 0 var(--c-green); }
  .note .callout.info { background: color-mix(in srgb, var(--c-blue) 9%, var(--paper)); box-shadow: inset 3px 0 0 var(--c-blue); }
  .note .callout.warning { background: color-mix(in srgb, var(--c-orange) 10%, var(--paper)); box-shadow: inset 3px 0 0 var(--c-orange); }
  .note .callout.danger { background: color-mix(in srgb, var(--c-red) 9%, var(--paper)); box-shadow: inset 3px 0 0 var(--c-red); }
  .note .callout b { display: block; }
  .note table.blk { width: 100%; margin: 10px 0; border-collapse: separate; border-spacing: 0; font-size: 0.92em; border-radius: 9px; box-shadow: 0 0 0 0.5px var(--line-strong); overflow: hidden; }
  .note th, .note td { text-align: left; padding: 7px 12px; border-bottom: 0.5px solid var(--line); }
  .note th { background: var(--fill-quiet); font-weight: 600; }
  .note tr:last-child td { border-bottom: 0; }
  .note .math { padding: 12px 0; text-align: center; font: italic 1.12em/1 "Latin Modern Math", "STIX Two Math", "Cambria Math", serif; }
  .note .frac { display: inline-grid; vertical-align: middle; text-align: center; font-style: normal; margin: 0 4px; }
  .note .frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px 2px; }
  .note .frac span:last-child { padding-top: 2px; }
  .note .figure { margin: 8px 0; padding: 12px; border-radius: 10px; background: var(--fill-quiet); display: grid; place-items: center; }
  .note .figure svg { width: 100%; max-width: 520px; height: auto; }
  .note .file { display: flex; align-items: center; gap: 12px; margin: 6px 0; padding: 10px 12px; border-radius: 10px; background: var(--fill-quiet); }
  .note .file .thumb { width: 44px; height: 54px; border-radius: 4px; background: linear-gradient(#fff 0 18%, color-mix(in srgb, var(--c-blue) 50%, #fff) 18% 40%, #fff 40%); box-shadow: 0 0 0 0.5px var(--line-strong); }
  .note .file small { display: block; color: var(--fg2); font-size: 12px; }
  .note .pagelink { display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 10px 12px; border-radius: 10px; box-shadow: inset 0 0 0 0.5px var(--line-strong); font-weight: 600; }
  .note blockquote.blk { margin: 6px 0; padding: 2px 0 2px 14px; box-shadow: inset 2px 0 0 var(--line-strong); color: var(--fg2); }
  .note mark { background: color-mix(in srgb, var(--c-yellow) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
  .blk { position: relative; border-radius: 8px; transition: background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out), transform var(--spring-smooth-dur) var(--spring-smooth); }
  .blk[data-col="red"] { color: var(--c-red); } .blk[data-col="blue"] { color: var(--c-blue); } .blk[data-col="green"] { color: var(--c-green); } .blk[data-col="orange"] { color: var(--c-orange); }
  .blk.new { animation: born var(--dur-slower) var(--ease-out); }
  @keyframes born { from { background-color: color-mix(in srgb, var(--accent) 22%, transparent); transform: scale(0.98); opacity: 0; } 40% { opacity: 1; } }
  .blk.gone { opacity: 0; transform: scale(0.96); transition-duration: var(--dur-fast); transition-timing-function: var(--ease-exit); }
  .blk.cur { background-color: color-mix(in srgb, var(--accent) 6%, transparent); }

  /* ---------- All Notes ---------- */
  .v-all .scroller { padding: calc(var(--safe) + var(--all-top, 80px)) var(--all-side, 28px) 120px var(--all-left, 28px); }
  .all-title { margin: 0 0 18px 4px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 18px; }
  .tile { position: relative; height: 250px; padding: 16px 16px 0; border-radius: 20px; background: var(--paper); box-shadow: 0 0 0 0.5px var(--line), 0 1px 3px rgb(0 0 0 / 0.04); overflow: hidden; transition: transform var(--spring-snappy-dur) var(--spring-snappy), opacity var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); touch-action: manipulation; }
  .tile:active { transform: scale(var(--press-scale)); transition-duration: var(--dur-instant); }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: linear-gradient(transparent, var(--paper)); }
  .tile h4 { margin: 0 0 10px; font-size: 16px; line-height: 1.25; font-weight: 700; }
  :is(.tile, .pile) .pv { font-size: 9.5px; line-height: 1.5; color: var(--fg2); }
  :is(.tile, .pile) .pv b { display: block; margin: 8px 0 2px; color: var(--fg); font-size: 11px; }
  :is(.tile, .pile) .pv i { display: block; font-style: normal; padding-left: 9px; position: relative; }
  :is(.tile, .pile) .pv i::before { content: ""; position: absolute; left: 1px; top: 6px; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
  :is(.tile, .pile) .pv u { display: flex; gap: 6px; align-items: center; text-decoration: none; margin: 4px 0; padding: 5px 6px; border-radius: 6px; background: var(--fill-quiet); }
  :is(.tile, .pile) .pv u::before { content: ""; width: 16px; height: 19px; border-radius: 2px; flex: none; background: linear-gradient(#fff 0 20%, color-mix(in srgb, var(--c-blue) 45%, #fff) 20% 45%, #fff 45%); box-shadow: 0 0 0 0.5px var(--line-strong); }
  .tile[data-col] h4::before { content: ""; display: inline-block; width: 9px; height: 9px; margin: 0 7px 1px 0; border-radius: 50%; background: var(--tc); vertical-align: middle; }
  .tile.gone { opacity: 0; transform: scale(0.9); }
  .tile.lift { z-index: 40; transform: scale(var(--lift-scale)); box-shadow: var(--shadow-lift); }
  .lift-scrim { position: absolute; z-index: 39; inset: -400px; background: color-mix(in srgb, var(--ground) 55%, transparent); opacity: 0; pointer-events: none; transition: opacity var(--dur-base) var(--ease-out); }
  .grid[data-lift] .lift-scrim { opacity: 1; }

  /* ---------- toasts, scrims, layers ---------- */
  .layer { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
  .layer > * { pointer-events: auto; }
  .catch { position: absolute; inset: 0; background: transparent; }
  .catch.dim { background: var(--scrim); opacity: 0; transition: opacity var(--dur-base) var(--ease-out); }
  .catch.dim.on { opacity: 1; }
  .toast { position: absolute; z-index: 90; top: calc(var(--safe) + 10px); left: 50%; translate: -50% 0; padding: 8px 14px; border-radius: 12px; background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); box-shadow: var(--shadow-menu); font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(-8px); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit); pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-out), transform var(--spring-snappy-dur) var(--spring-snappy); }
  .toast small { color: var(--fg2); font-weight: 400; margin-left: 6px; }

  /* ---------- menus (shared), skins set the measures ---------- */
  .m { position: absolute; z-index: 70; width: var(--mw, 260px); padding: var(--mp, 6px); border-radius: var(--mr, 14px); background: var(--glass); -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); box-shadow: var(--shadow-menu); font-size: 15px; opacity: 0; transform: scale(0.88); transform-origin: var(--to, top right); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit), filter var(--dur-fast) var(--ease-out); }
  .m[data-open] { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-out), transform var(--spring-gentle-dur) var(--spring-gentle), filter var(--dur-base) var(--ease-out); }
  .m .mh { padding: 10px 12px 10px; margin: 0 4px 6px; border-bottom: 0.5px solid var(--line-strong); font-weight: 700; font-size: 16px; }
  .mi { display: flex; align-items: center; gap: 12px; min-height: var(--mrow, 40px); padding: 0 12px; border-radius: calc(var(--mr, 14px) - var(--mp, 6px)); cursor: default; }
  .mi svg.i { width: 20px; height: 20px; color: var(--fg2); }
  .mi .tag { width: 20px; flex: none; text-align: center; font-size: 10px; font-weight: 700; color: var(--fg2); }
  .mi .lbl { flex: 1; min-width: 0; }
  .mi .chev { width: 14px; height: 14px; color: var(--fg3); stroke-width: 2.2; }
  .mi .chk { width: 16px; height: 16px; color: var(--accent); stroke-width: 2.4; }
  .mi .sw { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 0.5px var(--line-strong); }
  .mi.hot, .mi.open { background: var(--fill-hover); }
  .mi.flash { background: var(--fill-pressed); }
  .mi.danger, .mi.danger svg.i { color: var(--c-red); }
  .m .sep { height: 0.5px; margin: 6px 12px; background: var(--line-strong); }
  .m.behind { transform: scale(0.94) translateY(6px); opacity: 0.55; filter: saturate(0.6); pointer-events: auto; }

  /* skins */
  .m.craft { --mr: 26px; --mp: 8px; --mrow: 44px; --mw: 268px; }
  /* ============ 1 · CRAFT ============ */
  .ap1 { --top-gap: 74px; }
  .ap1 .grp { margin: 10px -14px; padding: 6px 14px 8px; border-radius: 12px; background: color-mix(in srgb, var(--fg) 3.5%, var(--paper)); }
  .rb { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); box-shadow: var(--float); transition: transform var(--spring-snappy-dur) var(--spring-snappy), opacity var(--dur-base) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
  .rb:active, .cap button:active { transform: scale(0.92); transition-duration: var(--dur-instant); }
  .cap { display: flex; align-items: center; height: 44px; padding: 0 2px; border-radius: 22px; background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); box-shadow: var(--float); }
  .cap button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; transition: transform var(--spring-snappy-dur) var(--spring-snappy); }

}
function pop(spec, anchor, o = {}) {

  el.innerHTML = (spec.header && (skin === "craft" || skin === "glass") ? `<div class="mh">${esc(spec.title)}</div>` : o.iosHead ? `<div class="mh">${esc(spec.title)}</div>` : "") + spec.items.map(rowHTML).join("");
  ensureCatch(o.dim);
  layer().append(el);
  const w = el.offsetWidth, h = el.offsetHeight, M = 12;

    const p = rect(o.parent.el), r = rect(o.row);
    if (skin === "glass") { x = p.x + (p.w - w) / 2 + 22; y = r.y - 10; ox = "50%"; oy = "0"; }

    }
  } else if (o.at) {
    x = o.at.x - w / 2; y = o.at.y + 14; ox = "50%"; oy = "0";
    if (y + h > H - M) { y = o.at.y - h - 14; oy = "100%"; }
  } else {
    const a = rect(anchor);
    if (o.besideOf) { const b = rect(o.besideOf); a.x = b.x - 4; a.w = b.w + 8; }
    const right = !o.besideOf && a.x + a.w / 2 > W / 2;
    x = o.beside ? (right ? a.x - w - 14 : a.x + a.w + 14) : right ? a.x + a.w - w : a.x;
    if (o.beside) { y = a.y; oy = "0"; ox = right ? "100%" : "0"; }
    else if (a.y + a.h / 2 > H / 2) { y = a.y - h - 10; oy = "100%"; ox = right ? "100%" : "0"; }
    else { y = a.y + a.h + 10; oy = "0"; ox = right ? "100%" : "0"; }
    if (o.center) { x = a.x + a.w / 2 - w / 2; ox = "50%"; }
  }
  x = clamp(x, M, W - w - M); y = clamp(y, (o.parent ? 0 : parseFloat(getComputedStyle(scr).getPropertyValue("--safe")) || 0) + M, H - h - M);
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.setProperty("--to", `${ox} ${oy}`);
  const m = { el, spec, parent: o.parent, skin, o };
  openMenus.push(m);
  if (o.parent && skin === "glass") o.parent.el.classList.add("behind");
  requestAnimationFrame(() => requestAnimationFrame(() => el.setAttribute("data-open", "")));
  // the highlight jumps with the finger or the pointer (Velum), rows answer a tap
  el.addEventListener("pointermove", (e) => { const r = e.target.closest(".mi"); $$(".mi.hot", el).forEach((x) => x !== r && x.classList.remove("hot")); r?.classList.add("hot"); });
  el.addEventListener("pointerleave", () => $$(".mi.hot", el).forEach((x) => x.classList.remove("hot")));
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    if (el.classList.contains("behind")) { closeAfter(m); return; }
    const r = e.target.closest(".mi"); if (!r) return;

}
function closeAfter(m) {
  const i = openMenus.indexOf(m);
  for (const c of openMenus.splice(i + 1)) { c.el.removeAttribute("data-open"); setTimeout(() => c.el.remove(), 300); }
  m.el.classList.remove("behind", "dimmed"); $$(".mi.open,.ri.open", m.el).forEach((x) => x.classList.remove("open"));
}
function choose(m, it, row) {
  if (it.sub) {
    closeAfter(m);
    row.classList.add("open");
    pop(it.sub, null, { ...m.o, skin: m.skin, parent: m, row, dim: false, iosHead: false });
    return;
  }
  row.classList.add("flash");
  setTimeout(() => { row.classList.remove("flash"); closeAll(); run(it.act); }, m.skin === "velum" ? 140 : 110);
}

/* ---------------- actions ---------------- */
function run(a) {
  if (!a) return;
  const i = a.indexOf(":"), k = i < 0 ? a : a.slice(0, i), v = i < 0 ? "" : a.slice(i + 1);
  switch (k) {
    case "grid": return S.view === "note" ? zoomOut() : zoomIn(S.note);
    case "open": return switchNote(v);
    case "folder": return toFolder(v || null);
    case "toast": return toast(v);
    case "share": return toast("Share", "a link anyone can read");
    case "ai": return toast(S.sel ? "Transform with AI" : "Chat with Claude", S.sel ? "the selected blocks" : "about this note");
    case "all": return zoomOut();
    case "note": return zoomIn(v);
    case "sidebar": S.side = !S.side; if (S.side) scr.dataset.side = ""; else delete scr.dataset.side; $$('[data-act="sidebar"].tb').forEach((b) => b.classList.toggle("on", S.side)); return;
    case "select": return enterSel();
    case "done": return exitSel();
    case "bg": S.bg = v; return look();
    case "w": S.width = v; return look();
    case "ts": S.ts = v; return look();
    case "ins": return insertBlock(v);
    case "sty": restyle(v); if (!S.sel) $$(".blk.sel").forEach((b) => b.classList.remove("sel")); return;
    case "col": selected().forEach((b) => v ? (b.dataset.col = v) : b.removeAttribute("data-col")); return;
    case "sel": return selAct(v);
    case "tcol": { const [id, c] = v.split(":"); const n = NOTES.find((x) => x.id === id); n.c = c || undefined; const t = $(`.tile[data-tile="${id}"]`); if (c) { t.dataset.col = c; t.style.setProperty("--tc", `var(--c-${c})`); } else t.removeAttribute("data-col"); return; }
    case "ttrash": { const t = $(`.tile[data-tile="${v}"]`); t.classList.add("gone"); setTimeout(() => t.remove(), 300); return toast("Moved to Trash"); }
  }
}
const selected = () => $$(".v-note .blk.sel");
function anchorFor(name) { return $(`.v-note [data-act="${name}"]`) || $(`.v-note [data-act="plus"]`); }
function selAct(v) {
  const btn = $(`.v-note [data-act="sel:${v}"]`);
  const a = S.a;
  if (v === "style" || v === "stylecaret") {
    if (v === "stylecaret" && !S.sel) { if (!cursor) return toast("Tap a block first"); cursor.classList.add("sel"); }
    const spec = selStyleSpec();
    if (a === 3) return palette(spec, btn || $('.v-note [data-act="sel:stylecaret"]'));
    if (a === 4) return sheet(spec, "grid");
    return present("selmenu", spec, btn);
  }
  if (v === "insert") return a === 3 ? palette(insertSpec(), btn) : a === 4 ? sheet(insertSpec(), "grid") : present("selmenu", insertSpec(), btn);
  if (v === "actions") return a === 4 ? pop(actionsSpec(), btn, { skin: "ios" }) : present("selmenu", actionsSpec(), btn);
  if (v === "colour") return a === 4 ? pop(colourSpec(), btn, { skin: "ios" }) : present("selmenu", colourSpec(), btn);
  const sel = selected();
  if (v === "all") { $$(".v-note .blk").forEach((b) => b.classList.add("sel")); return count(); }
  if (v === "ai") return run("ai");
  if (!sel.length) return toast("Nothing selected");
  if (v === "copy") return toast(`Copied ${sel.length} block${sel.length > 1 ? "s" : ""}`, "as Markdown");
  if (v === "cut") { toast(`Cut ${sel.length} block${sel.length > 1 ? "s" : ""}`); return removeBlocks(sel); }
  if (v === "del") { removeBlocks(sel); return toast(`Deleted ${sel.length} block${sel.length > 1 ? "s" : ""}`); }
  if (v === "dup") { for (const b of sel) { const c = b.cloneNode(true); c.classList.remove("sel"); c.classList.add("new"); b.after(c); } return; }
  if (v === "up" || v === "down") { for (const b of v === "up" ? sel : sel.reverse()) { const sib = v === "up" ? b.previousElementSibling : b.nextElementSibling; if (sib && sib.classList.contains("blk")) v === "up" ? sib.before(b) : sib.after(b); } return; }
}
function removeBlocks(list) {
  for (const b of list) { b.classList.add("gone"); setTimeout(() => { const p = b.parentElement; b.remove(); if (p && !p.querySelector(".blk") && p.parentElement?.classList.contains("grp")) p.remove(); const g = p?.closest(".grp"); if (g && !g.querySelector(".blk")) g.remove(); }, 180); }
  setTimeout(() => { count(); ring6(); }, 200);
}
function restyle(v) {
  for (const b of selected()) {
    if (v.startsWith("callout-")) { const c = document.createElement("div"); c.className = "blk callout sel " + v.slice(8); c.innerHTML = `<b>${v.slice(8) === "fold" ? "Folded" : v.slice(8)[0].toUpperCase() + v.slice(9)}</b>${b.innerHTML}`; swap(b, c); continue; }
    const tag = { h1: "h2", h2: "h2", h3: "h3", p: "p", quote: "blockquote", task: "p" }[v] || "p";
    if (b.tagName === "LI" || b.classList.contains("code") || b.tagName === "TABLE" || b.classList.contains("figure") || b.classList.contains("file")) continue;
    const c = document.createElement(tag); c.className = "blk sel"; c.innerHTML = b.innerHTML; if (v === "h1") c.style.fontSize = "1.7em"; swap(b, c);
  }
}
function swap(a, b) { a.replaceWith(b); b.classList.add("new"); }
function insertBlock(v) {
  const T = {
    h1: `<h2 class="blk" style="font-size:1.7em">Neuer Titel</h2>`, h2: `<h2 class="blk">Neue Überschrift</h2>`, h3: `<h3 class="blk">Unterüberschrift</h3>`, p: `<p class="blk">Neuer Absatz.</p>`,
    quote: `<blockquote class="blk">Ein Zitat.</blockquote>`, task: `<ul><li class="blk task"><span class="cb"></span>Neue Aufgabe</li></ul>`,
    "callout-info": `<div class="blk callout info"><b>Info</b>Ein Hinweis.</div>`, "callout-tip": `<div class="blk callout"><b>Tip</b>Ein Tipp.</div>`, "callout-warning": `<div class="blk callout warning"><b>Warning</b>Achtung.</div>`, "callout-danger": `<div class="blk callout danger"><b>Danger</b>Vorsicht.</div>`, "callout-fold": `<div class="blk callout info"><b>Folded ›</b></div>`,
    code: `<div class="blk code"><span class="ln">1</span><span class="src"><span class="kw">curl</span> http://raspberrypi4-dashboard-projektarbeit.local:8080/status</span></div>`,
    math: `<div class="blk math">P = U · I = 5 V · 2,5 A = 12,5 W</div>`,
    mermaid: `<div class="blk figure">${flowSVG()}</div>`, table: `<table class="blk"><tr><th>Spalte 1</th><th>Spalte 2</th></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></table>`, hr: `<hr class="blk">`,
    board: `<div class="blk figure" style="height:160px;background:var(--paper);box-shadow:inset 0 0 0 0.5px var(--line-strong)"><svg viewBox="0 0 300 120" style="max-width:300px"><path d="M30 80c30-50 60-50 80-10s50 20 70-20 60-20 80 10" fill="none" stroke="var(--c-blue)" stroke-width="3" stroke-linecap="round"/><circle cx="230" cy="40" r="16" fill="none" stroke="var(--c-red)" stroke-width="3"/></svg></div>`,
    page: `<div class="blk pagelink">${ic("page")}Neue Seite</div>`, pdf: `<div class="blk file"><span class="thumb"></span><span>Datenblatt_Pi4.pdf<small>PDF · 12 Seiten</small></span></div>`,
    pdfpage: `<div class="blk figure" style="height:150px"><span class="thumb" style="width:100px;height:130px;display:block;background:linear-gradient(#fff 0 14%,color-mix(in srgb,var(--c-blue) 40%,#fff) 14% 30%,#fff 30%);box-shadow:0 0 0 .5px var(--line-strong)"></span></div>`,
    pdfregion: `<div class="blk figure" style="height:110px"><span style="width:260px;height:80px;display:block;border-radius:4px;background:repeating-linear-gradient(#fff 0 8px,color-mix(in srgb,var(--fg) 12%,#fff) 8px 10px);box-shadow:0 0 0 .5px var(--line-strong)"></span></div>`,
  };
  const t = document.createElement("template"); t.innerHTML = T[v] || T.p;

  const sc = $(".v-note .scroller"), r = rect(blk);
  if (r.y > H - 200 || r.y < 80) sc.scrollBy({ top: r.y - H / 2, behavior: "smooth" });
  setCursor(blk);
}

/* ---------------- selection ---------------- */
function enterSel(first) {
  if (S.view !== "note") return;
  S.sel = true; scr.dataset.sel = "";
  if (first) first.classList.add("sel");
  delete scr.dataset.down;
  count(); ring6();
}
function exitSel() { S.sel = false; delete scr.dataset.sel; $$(".blk.sel").forEach((b) => b.classList.remove("sel")); closeAll(); }
function count() {

  $$("[data-count-t]").forEach((e) => (e.textContent = S.sel ? (n === 1 ? "1 Selected" : `${n} Selected`) : NOTES.find((x) => x.id === S.note).t));
