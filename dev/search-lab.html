<!doctype html>

<head>

<link rel="stylesheet" href="../vendor/katex/katex.min.css">

<style>
  /* A search over all notes, for the desktop: six proposals. Each finds whole notes (a note matches when its name or its
   * text has every word) and single blocks (a heading, a paragraph, a list item, a task, code, a formula, a callout that
   * has every word itself). They differ in where the search lives and how a result looks. The notes are made up; nothing
   * is written. Roles only (--v-*) in the mock window; literal values only for the lab's bar and the wallpaper.
   * Keys: 1–6 proposal (Alt+1–6 in a field), D appearance, Ctrl+K search, Tab Notes/Blocks, ↑ ↓ Enter, Esc. Not shipped. */
  html, body { margin: 0; height: 100%; }
  * { box-sizing: border-box; }
  body { display: flex; flex-direction: column; font-family: var(--v-font-sans); font-size: var(--v-type-body); color: var(--v-ink-primary); background: var(--v-bg-window); -webkit-font-smoothing: antialiased; }
  .sf { display: inline-grid; place-items: center; flex: none; width: 20px; font: 400 15px/1 ".SF Symbols Fallback"; font-style: normal; }
  .sf::before { content: attr(data-g); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  input { font: inherit; color: inherit; }

  /* ---------------------------------------------------------------- lab chrome (literal values allowed) */
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px 4px; }
  #bar h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #bar h1 small { margin-left: 8px; font-weight: 400; color: var(--v-ink-tertiary); }
  #bar .grp { display: inline-flex; align-items: center; gap: 4px; color: var(--v-ink-secondary); font-size: 11px; }
  #bar .grp > span { margin-right: 4px; }
  #bar button { padding: 3px 9px; border-radius: 6px; background: var(--v-fill-field); color: var(--v-ink-secondary); box-shadow: 0 0 0 0.5px var(--v-line-base); }
  #bar button.on { background: var(--v-accent-base); color: var(--v-ink-on-accent); box-shadow: none; }
  #bar .keys { margin-left: auto; color: var(--v-ink-tertiary); font-size: 11px; }
  #why { margin: 0; padding: 2px 20px 10px; max-width: 1180px; color: var(--v-ink-secondary); font-size: 12px; line-height: 1.5; min-height: 46px; }
  #why b { color: var(--v-ink-primary); }
  #stage { flex: 1; min-height: 0; padding: 14px 20px 20px; display: flex; justify-content: center;
    background: radial-gradient(circle at 15% 20%, #f6c7a8 0, transparent 45%), radial-gradient(circle at 85% 30%, #a9c4ff 0, transparent 45%),
                radial-gradient(circle at 50% 100%, #c9a8ee 0, transparent 55%), #c8d3e8; }
  [data-appearance="dark"] #stage { background: radial-gradient(circle at 15% 20%, #5a3a2a 0, transparent 45%), radial-gradient(circle at 85% 30%, #26365c 0, transparent 45%), #15161c; }

  /* ---------------------------------------------------------------- the window (roles only from here) */
  .win { position: relative; display: flex; width: 100%; max-width: 1240px; height: 100%; min-height: 560px; overflow: hidden;
         border-radius: var(--v-radius-window); background: var(--v-bg-window); box-shadow: 0 0 0 0.5px rgb(0 0 0 / .16), 0 30px 80px -20px rgb(0 0 0 / .42); }
  .glass { background: var(--v-popover-bg); color: var(--v-popover-ink); box-shadow: var(--v-popover-shadow);
           -webkit-backdrop-filter: blur(var(--v-popover-blur)) saturate(var(--v-popover-saturate)); backdrop-filter: blur(var(--v-popover-blur)) saturate(var(--v-popover-saturate)); }
  .btn { display: inline-grid; place-items: center; grid-auto-flow: column; gap: var(--v-space-6); height: var(--v-control-height); min-width: var(--v-control-height); padding: 0 var(--v-space-6);
         border-radius: var(--v-radius-control); flex: none; white-space: nowrap; font-size: var(--v-type-callout); }
  .btn:hover { background: var(--v-fill-hover); }
  mark { background: color-mix(in srgb, var(--v-accent-base) 24%, transparent); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--v-accent-base) 24%, transparent); }
  mark.cur { background: var(--v-accent-base); color: var(--v-ink-on-accent); box-shadow: 0 0 0 1px var(--v-accent-base); }
  .hl mark, .sel.inv mark { background: color-mix(in srgb, var(--v-menu-highlight-ink) 30%, transparent); box-shadow: none; }

  /* the segmented control: Notes | Blocks */
  .seg { display: inline-flex; flex: none; gap: 1px; padding: var(--v-segment-pad); border-radius: var(--v-radius-segment); background: var(--v-segment-track); font-size: var(--v-type-small); font-weight: var(--v-weight-medium); }
  .seg button { padding: 2px var(--v-space-10); border-radius: var(--v-radius-segment-plate); color: var(--v-ink-secondary); white-space: nowrap; }
  .seg button.on { background: var(--v-segment-plate); color: var(--v-ink-primary); box-shadow: var(--v-segment-plate-shadow); }
  .seg button i { font-style: normal; color: var(--v-ink-tertiary); margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* the sidebar: the app's Library layout */
  .side { flex: none; display: flex; flex-direction: column; width: calc(var(--v-sidebar-width) + var(--v-space-24)); margin: var(--v-sidebar-inset) 0 var(--v-sidebar-inset) var(--v-sidebar-inset);
          padding: var(--v-space-8) 0; border-radius: var(--v-radius-sidebar); background: var(--v-bg-sidebar); box-shadow: var(--v-sidebar-shadow), 0 0 0 0.5px var(--v-line-base); overflow: hidden; user-select: none; z-index: 2; }
  .side .scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-width: none; padding-bottom: var(--v-space-8); }
  .head { display: flex; align-items: center; gap: var(--v-space-6); padding: var(--v-space-12) var(--v-space-16) var(--v-space-4) calc(var(--v-space-10) + var(--v-space-8)); font-size: var(--v-type-small); font-weight: var(--v-weight-semibold); color: var(--v-ink-tertiary); }
  .head .r { margin-left: auto; font-weight: var(--v-weight-regular); }
  .row { display: flex; align-items: center; gap: var(--v-space-8); height: var(--v-row-height); margin: 0 var(--v-space-10); padding: 0 var(--v-space-8);
         border-radius: var(--v-radius-row); color: var(--v-ink-sidebar); white-space: nowrap; }
  .row .sf { color: var(--v-ink-sidebar-glyph); font-size: 16px; }
  .row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .cnt { color: var(--v-ink-tertiary); font-size: var(--v-type-small); font-variant-numeric: tabular-nums; }
  .row.sel { background: var(--v-fill-selected); color: var(--v-ink-primary); }
  .row .sq { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none; }
  .row .sq .sf { color: var(--v-ink-on-accent); font-size: 11px; width: auto; }
  .field { display: flex; align-items: center; gap: var(--v-space-6); height: var(--v-control-height); padding: 0 var(--v-space-8); margin: var(--v-space-2) var(--v-space-10) var(--v-space-8);
           border-radius: var(--v-radius-control); background: var(--v-fill-field); box-shadow: 0 0 0 0.5px var(--v-line-strong); color: var(--v-ink-tertiary); font-size: var(--v-type-callout); white-space: nowrap; }
  .field .sf { font-size: 13px; width: 16px; }
  .field kbd { margin-left: auto; font: inherit; font-size: var(--v-type-caption); padding: 1px 5px; border-radius: 5px; background: var(--v-fill-pressed); }
  .field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--v-ink-primary); caret-color: var(--v-accent-base); }
  .field input::placeholder { color: var(--v-ink-tertiary); }
  .field .x { color: var(--v-ink-tertiary); font-size: 13px; }
  .field:focus-within { box-shadow: 0 0 0 0.5px var(--v-line-strong), 0 0 0 3px color-mix(in srgb, var(--v-accent-base) 32%, transparent); }
  .foot { display: flex; align-items: center; gap: var(--v-space-2); padding: var(--v-space-6) var(--v-space-10) 0; color: var(--v-ink-secondary); }
  .foot .sp { flex: 1; }

  /* the note beside it */
  .main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .island { position: absolute; z-index: 3; top: var(--v-space-10); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: var(--v-space-2); padding: var(--v-space-4); border-radius: var(--v-radius-sidebar); }
  .tab { display: flex; align-items: center; gap: var(--v-space-6); height: calc(var(--v-control-height) - 2px); padding: 0 var(--v-space-12); border-radius: var(--v-radius-control); font-size: var(--v-type-callout); color: var(--v-popover-ink-secondary); white-space: nowrap; }
  .tab .sf { font-size: 13px; width: 16px; }
  .tab.on { background: var(--v-segment-plate); color: var(--v-popover-ink); box-shadow: var(--v-segment-plate-shadow); }
  .island .btn { height: calc(var(--v-control-height) - 2px); color: var(--v-popover-ink-secondary); }
  .page { flex: 1; overflow: auto; scrollbar-width: none; padding: calc(var(--v-control-height) + var(--v-space-32) + var(--v-space-16)) var(--v-space-32) var(--v-space-32); }
  .paper { position: relative; max-width: 640px; margin: 0 auto; line-height: 1.6; font-size: 15px; }
  .crumb { color: var(--v-ink-tertiary); font-size: var(--v-type-small); margin-bottom: var(--v-space-6); display: flex; align-items: center; gap: 4px; }
  .crumb .sf { width: auto; font-size: 10px; }
  .crumb .back { display: inline-flex; align-items: center; gap: 2px; color: var(--v-accent-text); margin-right: var(--v-space-8); }
  .doc h1 { margin: 0 0 var(--v-space-16); font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; }
  .doc h2 { font-size: 20px; line-height: 1.3; margin: var(--v-space-24) 0 var(--v-space-8); }
  .doc h3 { font-size: 17px; margin: var(--v-space-16) 0 var(--v-space-6); }
  .doc p { margin: 0 0 var(--v-space-12); }
  .doc .li { position: relative; padding-left: 22px; margin: 0 0 var(--v-space-4); }
  .doc .li::before { content: ""; position: absolute; left: 8px; top: 0.7em; width: 5px; height: 5px; border-radius: 50%; background: var(--v-ink-secondary); }
  .doc .task { display: flex; gap: var(--v-space-8); align-items: flex-start; margin: 0 0 var(--v-space-4); }
  .doc .task .box { flex: none; width: 16px; height: 16px; margin-top: 0.22em; border-radius: var(--v-layout-checkbox-radius); box-shadow: inset 0 0 0 1.5px var(--v-line-strong); display: grid; place-items: center; }
  .doc .task.done .box { background: var(--v-accent-base); box-shadow: none; }
  .doc .task.done .box::before { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--v-ink-on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .doc .task.done > span:last-child { color: var(--v-ink-tertiary); text-decoration: line-through; }
  .doc pre { position: relative; margin: 0 0 var(--v-space-12); padding: var(--v-space-12) var(--v-space-16); border-radius: var(--v-radius-control); background: var(--v-fill-field); box-shadow: 0 0 0 0.5px var(--v-line-base);
             font: 13px/1.55 var(--v-font-mono); white-space: pre-wrap; overflow: hidden; }
  .doc pre .lang { position: absolute; top: var(--v-space-6); right: var(--v-space-10); font: var(--v-type-caption) var(--v-font-sans); color: var(--v-ink-tertiary); }
  .doc .math { margin: 0 0 var(--v-space-12); padding: var(--v-space-6) 0; text-align: center; overflow-x: auto; scrollbar-width: none; }
  .doc .math.hit { border-radius: var(--v-radius-control); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--v-accent-base) 45%, transparent); }
  .doc .callout { margin: 0 0 var(--v-space-12); padding: var(--v-space-10) var(--v-space-16); border-radius: var(--v-radius-control); background: color-mix(in srgb, var(--v-accent-base) 8%, transparent); }
  .doc .callout.tip { background: color-mix(in srgb, var(--v-success-base) 10%, transparent); }
  .doc .callout.warn { background: color-mix(in srgb, var(--v-danger) 8%, transparent); }
  .doc .callout .ct { display: flex; align-items: center; gap: 2px; font-weight: var(--v-weight-semibold); color: var(--v-accent-text); }
  .doc .callout.tip .ct { color: var(--v-success-base); } .doc .callout.warn .ct { color: var(--v-danger); }
  .doc .callout .ct .sf { font-size: 13px; }
  .doc .callout p { margin: var(--v-space-2) 0 0; }
  .doc blockquote { margin: 0 0 var(--v-space-12); padding-left: var(--v-space-16); border-left: 3px solid var(--v-line-strong); color: var(--v-ink-secondary); font-style: italic; }
  .doc [data-b]:not(blockquote) { border-radius: var(--v-radius-row); }
  .doc .flash { animation: flash calc(var(--v-dur-slower) * 4) var(--v-ease-out); }
  @keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--v-accent-base) 16%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--v-accent-base) 16%, transparent); } }
  .doc .focus { box-shadow: 0 0 0 5px var(--v-bg-content), 0 0 0 7px color-mix(in srgb, var(--v-accent-base) 55%, transparent); }

  /* the hits in an open note: a capsule at the page's top right (all proposals) */
  .hits { position: absolute; z-index: 4; top: var(--v-space-10); right: var(--v-space-16); display: flex; align-items: center; gap: var(--v-space-2); height: calc(var(--v-control-height) + var(--v-space-8)); padding: 0 var(--v-space-4) 0 var(--v-space-12);
          border-radius: var(--v-radius-sidebar); font-size: var(--v-type-callout); white-space: nowrap; }
  .hits b { font-weight: var(--v-weight-semibold); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .hits small { color: var(--v-popover-ink-secondary); margin: 0 var(--v-space-6) 0 var(--v-space-8); font-variant-numeric: tabular-nums; }
  .hits .btn { height: calc(var(--v-control-height) - 2px); min-width: calc(var(--v-control-height) - 2px); color: var(--v-popover-ink-secondary); }

  .toast { position: absolute; z-index: 30; left: 50%; bottom: var(--v-space-24); transform: translateX(-50%); padding: var(--v-space-8) var(--v-space-16); border-radius: var(--v-radius-pill); font-size: var(--v-type-callout);
           opacity: 0; transition: opacity var(--v-dur-base) var(--v-ease-out); pointer-events: none; }
  .toast.on { opacity: 1; }
  .empty { padding: var(--v-space-24) var(--v-space-16); color: var(--v-ink-tertiary); text-align: center; font-size: var(--v-type-callout); }
  .empty b { display: block; color: var(--v-ink-secondary); font-weight: var(--v-weight-semibold); margin-bottom: var(--v-space-4); }
  .kg { color: var(--v-ink-tertiary); font-size: 13px; }
  .snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snip.mono { font-family: var(--v-font-mono); font-size: 0.92em; }

  /* the menu of a popup button (6) */
  .menu { position: absolute; z-index: 40; min-width: var(--v-menu-min-width); padding: var(--v-menu-pad); border-radius: var(--v-radius-menu); background: var(--v-menu-bg); color: var(--v-menu-ink); box-shadow: var(--v-menu-shadow);
          -webkit-backdrop-filter: blur(var(--v-menu-blur)) saturate(var(--v-menu-saturate)); backdrop-filter: blur(var(--v-menu-blur)) saturate(var(--v-menu-saturate)); font-size: var(--v-menu-font); }
  .menu div { display: flex; align-items: center; gap: var(--v-layout-menu-glyph-gap); height: var(--v-menu-row); padding: 0 var(--v-layout-menu-item-pad-x); border-radius: var(--v-radius-menu-row); white-space: nowrap; }
  .menu div .ck { width: 12px; visibility: hidden; } .menu div.on .ck { visibility: visible; }
  .menu div:hover { background: linear-gradient(var(--v-menu-highlight-top), var(--v-menu-highlight)); color: var(--v-menu-highlight-ink); }
  .menu div small { margin-left: auto; padding-left: var(--v-space-16); opacity: .6; font-variant-numeric: tabular-nums; }

  /* ---- 1 · Go to, grown: today's palette with a section of blocks */
  .pal { position: absolute; z-index: 10; top: 14%; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - var(--v-space-32))); padding: var(--v-popover-pad); border-radius: var(--v-radius-popover); }
  .pal .pf { display: flex; align-items: center; gap: var(--v-space-8); height: calc(var(--v-control-height) + var(--v-space-10)); padding: 0 var(--v-space-6) 0 var(--v-space-10); }
  .pal .pf > .sf { color: var(--v-popover-ink-secondary); font-size: 17px; }
  .pal .pf input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: var(--v-type-title3); caret-color: var(--v-accent-base); }
  .pal .pf input::placeholder { color: var(--v-popover-ink-secondary); }
  .pal .pl { max-height: 52vh; overflow-y: auto; scrollbar-width: none; margin-top: var(--v-space-2); padding-top: var(--v-space-4); border-top: 0.5px solid var(--v-popover-line); }
  .pal .ph { display: flex; padding: var(--v-space-6) var(--v-space-10) var(--v-space-2); color: var(--v-popover-ink-secondary); font-size: var(--v-type-caption); font-weight: var(--v-weight-semibold); }
  .pal .ph span { margin-left: auto; font-weight: var(--v-weight-regular); }
  .pal .pr { display: flex; align-items: center; gap: var(--v-space-10); height: calc(var(--v-control-height) + var(--v-space-4)); padding: 0 var(--v-space-10); border-radius: var(--v-radius-menu-row); }
  .pal .pr > .sf { color: var(--v-popover-ink-secondary); font-size: 14px; }
  .pal .pr .t { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal .pr.blk .t { flex: 1; max-width: none; }
  .pal .pr small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--v-popover-ink-secondary); font-size: var(--v-type-small); }
  .pal .pr.blk small { flex: none; max-width: 34%; }
  .pal .pr kbd { margin-left: auto; font: inherit; font-size: var(--v-type-small); color: var(--v-popover-ink-secondary); }
  .pal .pr.hl { background: linear-gradient(var(--v-menu-highlight-top), var(--v-menu-highlight)); color: var(--v-menu-highlight-ink); }
  .pal .pr.hl :is(.sf, small, kbd) { color: inherit; }
  .pal .pr .more { margin-left: auto; color: var(--v-popover-ink-secondary); font-size: var(--v-type-small); }
  .pal .pft { display: flex; flex-wrap: wrap; gap: var(--v-space-16); margin-top: var(--v-space-4); padding: var(--v-space-6) var(--v-space-10) var(--v-space-4); border-top: 0.5px solid var(--v-popover-line); color: var(--v-popover-ink-secondary); font-size: var(--v-type-small); }
  .pal .pft .n { margin-left: auto; }

  /* ---- 2 · Spotlight: the list at the left, the note at the right */
  .spot { position: absolute; z-index: 10; top: 7%; bottom: 7%; left: 50%; transform: translateX(-50%); width: min(900px, calc(100% - var(--v-space-32))); display: flex; flex-direction: column; border-radius: var(--v-radius-popover); overflow: hidden; }
  .spot .pf { display: flex; align-items: center; gap: var(--v-space-10); height: 58px; padding: 0 var(--v-space-12) 0 var(--v-space-16); border-bottom: 0.5px solid var(--v-popover-line); }
  .spot .pf > .sf { color: var(--v-popover-ink-secondary); font-size: 20px; width: 24px; }
  .spot .pf input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: var(--v-type-title2); font-weight: var(--v-weight-regular); caret-color: var(--v-accent-base); }
  .spot .pf input::placeholder { color: var(--v-popover-ink-secondary); }
  .spot .sb { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px 1fr; }
  .spot .sl { overflow-y: auto; scrollbar-width: none; padding: var(--v-space-6); border-right: 0.5px solid var(--v-popover-line); }
  .spot .sh { padding: var(--v-space-8) var(--v-space-8) var(--v-space-2); color: var(--v-popover-ink-secondary); font-size: var(--v-type-caption); font-weight: var(--v-weight-semibold); }
  .spot .sr { display: grid; grid-template-columns: 20px 1fr; gap: 0 var(--v-space-8); padding: var(--v-space-6) var(--v-space-8); border-radius: var(--v-radius-menu-row); }
  .spot .sr > .sf { grid-row: 1 / 3; align-self: start; margin-top: 1px; color: var(--v-popover-ink-secondary); font-size: 14px; }
  .spot .sr b { font-weight: var(--v-weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spot .sr small { color: var(--v-popover-ink-secondary); font-size: var(--v-type-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spot .sr.hl { background: linear-gradient(var(--v-menu-highlight-top), var(--v-menu-highlight)); color: var(--v-menu-highlight-ink); }
  .spot .sr.hl :is(.sf, small) { color: inherit; }
  .spot .pv { position: relative; overflow: hidden; background: var(--v-bg-content); }
  .spot .pv .pvs { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: var(--v-space-24) var(--v-space-32) 40%; }
  .spot .pv .doc { font-size: 13.5px; line-height: 1.55; } .spot .pv .doc h1 { font-size: 24px; } .spot .pv .doc h2 { font-size: 17px; }
  .spot .pv .pvh { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: var(--v-space-8); padding: var(--v-space-8) var(--v-space-16); font-size: var(--v-type-small); color: var(--v-popover-ink-secondary); border-top: 0.5px solid var(--v-popover-line); }

const KINDS = [["h", "Headings", "heading"], ["p", "Text", "text"], ["li", "Lists", "list"], ["task", "Tasks", "todo"], ["code", "Code", "code"], ["math", "Math", "fn"], ["callout", "Callouts", "callout"], ["quote", "Quotes", "quote"]];
const KG = Object.fromEntries(KINDS.map(([k, , g]) => [k, g])), KN = Object.fromEntries(KINDS.map(([k, n]) => [k, n]));
const IS = { heading: "h", headings: "h", text: "p", list: "li", task: "task", tasks: "task", code: "code", math: "math", callout: "callout", quote: "quote" };
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const btext = (b) => (b.k === "callout" ? b.title + " " + b.t : b.t);
const kg = (b) => (b.k === "task" && b.done ? "todoF" : KG[b.k]);

// The words, and what `is:` and `in:` ask for (all six read them; 6 shows them)
function parse(q) {
  const o = { terms: [], kinds: new Set(), open: null, folder: null, toks: [] };
  for (const m of q.matchAll(/"([^"]+)"|(\S+)/g)) {
    if (m[2]) {
      const f = /^(is|in):(.+)$/i.exec(m[2]);
      if (f) {
        const v = norm(f[2]);
        if (f[1].toLowerCase() === "in") { const fo = FOLDERS.find(([n]) => norm(n).startsWith(v)); if (fo) { o.folder = fo[0]; o.toks.push(m[0]); continue; } }
        else if (IS[v]) { o.kinds.add(IS[v]); o.toks.push(m[0]); continue; }
        else if (v === "open" || v === "done") { o.kinds.add("task"); o.open = v === "open"; o.toks.push(m[0]); continue; }
      }
    }
    o.terms.push(norm(m[1] ?? m[2]));
  }

  if (S.openF != null) { o.kinds.add("task"); o.open = S.openF; }

}
const count = (tx, terms) => terms.reduce((a, t) => { let c = 0, p = 0; while ((p = tx.indexOf(t, p)) >= 0) { c++; p += t.length; } return a + c; }, 0);
function blockHits(pq) {
  const out = [];
  if (!pq.terms.length && !pq.filtered) return out;
  for (const n of NOTES) {
    if (pq.folder && n.f !== pq.folder) continue;
    n.b.forEach((b, i) => {
      if (pq.kinds.size && !pq.kinds.has(b.k)) return;
      if (pq.open != null && b.done === pq.open) return;
      const tx = norm(btext(b));
      if (!pq.terms.every((t) => tx.includes(t))) return;
      out.push({ type: "block", n, i, b, score: count(tx, pq.terms) + (b.k === "h" ? 3 : 0) });
    });
  }
  return out;
}
function noteHits(pq, blocks) {
  const out = [];
  if (!pq.terms.length && !pq.filtered) return out;
  for (const n of NOTES) {
    if (pq.folder && n.f !== pq.folder) continue;
    const mine = blocks.filter((r) => r.n === n);
    const title = norm(n.t), all = title + " " + n.b.map((b) => norm(btext(b))).join(" ");
    const ok = pq.kinds.size ? mine.length > 0 : pq.terms.every((t) => all.includes(t));
    if (!ok) continue;
    const inTitle = pq.terms.filter((t) => title.includes(t)).length;
    const best = mine[0] ? mine[0].i : n.b.findIndex((b) => pq.terms.some((t) => norm(btext(b)).includes(t)));
    out.push({ type: "note", n, i: best, blocks: mine.length, count: count(all, pq.terms), inTitle, score: inTitle * 10 + count(all, pq.terms) });

}
function run() {
  const pq = parse(S.q), blocks = blockHits(pq), notes = noteHits(pq, blocks);

// The words marked in a text; a line cut so that the first word shows
function ranges(text, terms) {
  const low = norm(text), r = [];
  for (const t of terms) if (t) { let p = 0; while ((p = low.indexOf(t, p)) >= 0) { r.push([p, p + t.length]); p += t.length; } }

}

}

}
const snipOf = (b, terms, lead) => (b.k === "callout" ? `<b>${mark(b.title, terms)}</b> ` + snippet(b.t, terms, lead) : snippet(b.t, terms, lead));
const headOf = (n, i) => { for (let j = i - 1; j >= 0; j--) if (n.b[j].k === "h") return n.b[j].t; return ""; };
const where = (n) => n.f || "Notes";

const found = (notes, blocks) => (S.scope === "notes" ? pl(notes.length, "note") : `${pl(blocks.length, "block")} in ${pl(new Set(blocks.map((r) => r.n)).size, "note")}`);

// A block as the note draws it
function blockHTML(b, terms, i, cls = "") {

    case "li": return `<div ${a} ${c("li")}>${mark(b.t, terms)}</div>`;
    case "task": return `<div ${a} ${c("task" + (b.done ? " done" : ""))}><span class="box"></span><span>${mark(b.t, terms)}</span></div>`;
    case "code": return `<pre ${a} ${c("")}><span class="lang">${esc(b.lang)}</span><code>${mark(b.t, terms)}</code></pre>`;
    case "math": {

      return `<div ${a} ${c("math" + (terms.length && terms.every((t) => norm(b.t).includes(t)) ? " hit" : ""))}>${h}</div>`;

// ---------------------------------------------------------------- driving it
const PS = { 1: P1, 2: P2, 3: P3, 4: P4, 5: P5, 6: P6 };
const cur = () => PS[S.p];
function frame() {
  win.className = "win p" + S.p;
  if (!scopes().some(([v]) => v === S.scope)) S.scope = "blocks";
  win.innerHTML = cur().frame() + `<div class="toast glass"></div>`;
  const q = document.getElementById("q");
  if (q) { q.value = S.q; bindInput(q); }
  drawNote();
  update();
  if (q && (S.p !== 3 || !S.picked)) { q.focus({ preventScroll: true }); q.setSelectionRange(q.value.length, q.value.length); }
  document.getElementById("why").innerHTML = WHY[S.p];
  document.querySelectorAll("#o-p button").forEach((b) => b.classList.toggle("on", +b.dataset.p === S.p));
}
function update() {
  cur().update();
  const f = win.querySelector('.field[data-act="search"] .snip'); if (f) f.textContent = [...tokens(), S.q].join(" ").trim() || "Search";
}
function go(p) { if (S.p !== p && (S.p === 6 || S.p === 4)) untokenize(); if (p === 6) tokenize(true); S.p = p; S.hl = 0; S.picked = false; S.open = true; S.view = p === 5 && !S.q.trim() ? "note" : "results"; frame(); }
function setScope(v) { S.scope = v; S.hl = 0; S.picked = false; update(); }
function openSearch() {
  if (S.p <= 2) { S.open = true; frame(); }
  else if (S.p >= 4 && S.view === "note" && S.p !== 5) { S.view = "results"; frame(); }
  else if (S.p === 5 && S.view === "note" && S.q) { S.view = "results"; frame(); }
  const q = document.getElementById("q"); q?.focus(); q?.select();
}
function bindInput(q) {
  q.addEventListener("input", () => {
    S.q = q.value; S.hl = 0; S.picked = false;
    if (S.p === 6 && tokenize(false)) q.value = S.q;
    if (S.p === 5 && S.view === "note" && S.q.trim()) S.view = "results";
    if (S.p === 5) { const pg = document.getElementById("page"); if (pg) pg.scrollTop = 0; }
    update();
  });
  q.addEventListener("keydown", (e) => {
    if (e.altKey && /^[1-6]$/.test(e.key)) return; // (the lab's keys: the document takes them)
    const n = S.list.length;
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
      e.preventDefault();
      if (!S.picked && S.p >= 3 && S.p <= 5) { S.picked = true; S.hl = e.key === "ArrowDown" ? 0 : n - 1; }
      else S.hl = (S.hl + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
      cur().hl();
    } else if (e.key === "Enter") { e.preventDefault(); openResult(S.list[S.hl], e.ctrlKey || e.metaKey); }
    else if (e.key === "Tab") {
      e.preventDefault();
      if (S.p === 6 && S.sugg?.length) { S.q = S.q.replace(/(?:is|in):\S*$/i, S.sugg[0] + " "); q.value = S.q; update(); return; }

    else if (e.key === "Backspace" && S.p === 6 && q.selectionStart === 0 && q.selectionEnd === 0 && tokens().length) {
      e.preventDefault(); const t = tokens().pop();
      if (t.startsWith("in:")) S.folder = null; else { S.kind = null; S.openF = null; }
      update();
    }
  });
}

// 6: a filter written and closed by a space (or all of them, on arriving) becomes a token; leaving 6 (or 4) writes them back as words
const tokens = () => [S.openF != null ? (S.openF ? "is:open" : "is:done") : S.kind ? "is:" + KN[S.kind].toLowerCase().replace(/s$/, "") : "", S.folder ? "in:" + S.folder.split(" ")[0].toLowerCase() : ""].filter(Boolean);
function tokenize(all) {
  let changed = false;
  S.q = S.q.replace(all ? /(^|\s)(is|in):(\S+)(?=\s|$)/gi : /(^|\s)(is|in):(\S+)(?=\s)/gi, (m, pre, k, v) => {
    const n = norm(v);
    if (k.toLowerCase() === "in") { const fo = FOLDERS.find(([f]) => norm(f).startsWith(n)); if (!fo) return m; S.folder = fo[0]; }
    else if (n === "open" || n === "done") { S.openF = n === "open"; S.kind = null; }
    else if (IS[n]) { S.kind = IS[n]; S.openF = null; }
    else return m;
    changed = true; return pre;
  });
  if (changed) S.q = S.q.replace(/^\s+/, "").replace(/\s{2,}/g, " ");
  return changed;
}
function untokenize() { const t = tokens(); S.kind = null; S.folder = null; S.openF = null; if (t.length) S.q = (t.join(" ") + " " + S.q).trim(); }

// the menu of a popup button (6)
function popMenu(btn, items, pick) {
  win.querySelector(".menu.pm")?.remove();
  const r = btn.getBoundingClientRect(), w = win.getBoundingClientRect();
  win.insertAdjacentHTML("beforeend", `<div class="menu pm" style="left:${r.left - w.left}px;top:${r.bottom - w.top + 4}px">${items.map(([v, l, on, c], i) => `<div data-v="${i}" class="${on ? "on" : ""}"><span class="ck">${sf("check")}</span>${esc(l)}${c != null ? `<small>${c}</small>` : ""}</div>`).join("")}</div>`);
  const m = win.querySelector(".menu.pm");
  m.addEventListener("mousedown", (e) => { const d = e.target.closest("[data-v]"); if (d) { e.preventDefault(); const it = items[+d.dataset.v]; m.remove(); pick(it[0]); } });
}

win.addEventListener("mousedown", (e) => {
  const t = e.target;
  if (!t.closest(".menu.pm") && !t.closest("[data-pop]")) win.querySelector(".menu.pm")?.remove();
  // a press beside the palette closes it (as the app's Go to…)
  if (S.p <= 2 && S.open && !t.closest(".pal, .spot") && !t.closest('[data-act="search"]')) { S.open = false; frame(); return; }
  const sc = t.closest("[data-scope]"); if (sc) { e.preventDefault(); setScope(sc.dataset.scope); return; }
  const act = t.closest("[data-act]")?.dataset.act;
  if (act === "search") { e.preventDefault(); openSearch(); return; }
  if (act === "hprev" || act === "hnext") { e.preventDefault(); stepHit(act === "hprev" ? -1 : 1); return; }
  if (act === "hclose") { e.preventDefault(); S.markQ = ""; S.flash = -1; drawNote(); return; }
  if (act === "clear") { e.preventDefault(); if (S.p === 5) { S.q = ""; S.markQ = ""; S.view = "note"; frame(); } else cur().esc(); return; }
  if (act === "back") { e.preventDefault(); S.view = "results"; frame(); return; }
  const sg = t.closest("[data-sugg]"); if (sg) { e.preventDefault(); S.q = S.q.replace(/(?:is|in):\S*$/i, sg.dataset.sugg + " "); const q = document.getElementById("q"); q.value = S.q; q.focus(); update(); return; }
  const pop = t.closest("[data-pop]");
  if (pop) {
    e.preventDefault();
    const save = [S.kind, S.folder, S.openF]; S.kind = null; S.folder = null; S.openF = null; const all = blockHits(parse(S.q)); [S.kind, S.folder, S.openF] = save;
    if (pop.dataset.pop === "kind") popMenu(pop, [[null, "Any", !S.kind, all.length], ...KINDS.map(([k, l]) => [k, l, S.kind === k, all.filter((r) => r.b.k === k).length])], (v) => { S.kind = v; S.openF = null; S.hl = 0; update(); });
    else popMenu(pop, [[null, "All folders", !S.folder], ...FOLDERS.map(([n]) => [n, n, S.folder === n, all.filter((r) => r.n.f === n).length])], (v) => { S.folder = v; S.hl = 0; update(); });
    return;
  }
  const tk = t.closest("[data-tok]"); if (tk) { e.preventDefault(); const x = tokens()[+tk.dataset.tok]; if (x.startsWith("in:")) S.folder = null; else { S.kind = null; S.openF = null; } update(); return; }
  const kc = t.closest("[data-kind]"); if (kc) { e.preventDefault(); S.kind = kc.dataset.kind || null; S.hl = 0; update(); return; }
  const fold = t.closest("[data-fold]"); if (fold) { e.preventDefault(); const id = fold.dataset.fold; S.shut.has(id) ? S.shut.delete(id) : S.shut.add(id); update(); return; }
  const srt = t.closest("[data-sort]"); if (srt) { e.preventDefault(); S.sort = S.sort === srt.dataset.sort ? "rank" : srt.dataset.sort; update(); return; }
  const op = t.closest("[data-open]"); if (op) { e.preventDefault(); openResult({ type: "note", n: NOTES.find((n) => n.id === op.dataset.open), i: -1 }, e.ctrlKey); return; }
  const go = t.closest("[data-go]"); if (go) { e.preventDefault(); openResult(S.list[+go.dataset.go], e.ctrlKey); return; }
  // a task is ticked in the results (5)
  const box = t.closest(".stream .task .box"); if (box) { e.preventDefault(); const r = S.list[+box.closest("[data-i]").dataset.i]; r.b.done = !r.b.done; update(); return; }
  const row = t.closest("[data-i]");
  if (row && S.list[+row.dataset.i]) {
    e.preventDefault(); S.hl = +row.dataset.i; S.picked = true;
    if (S.p === 3) cur().hl(true);
    else if (S.p === 6 && e.detail < 2) cur().hl();
    else if ((S.p === 2 || S.p === 5) && e.detail < 2) cur().hl();
    else openResult(S.list[S.hl], e.ctrlKey);
  }
});
win.addEventListener("mousemove", (e) => {
  if (S.p > 2) return;
  const r = e.target.closest("[data-i]"); if (r && +r.dataset.i !== S.hl) { S.hl = +r.dataset.i; cur().hl(); }
});

document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); return; }
  if (/^[1-6]$/.test(e.key) && (!typing || e.altKey)) { e.preventDefault(); go(+e.key); return; }
  if (typing) return;
  if (e.key === "d" || e.key === "D") { setAppearance(root.dataset.appearance === "dark" ? "light" : "dark"); return; }
  if (e.key === "Escape" && S.p >= 4 && S.view === "note" && S.q) { S.view = "results"; frame(); }
});

// the lab's bar
function setAppearance(v) { root.dataset.appearance = v; document.querySelectorAll("#o-a button").forEach((b) => b.classList.toggle("on", b.dataset.v === v)); }
document.getElementById("o-p").insertAdjacentHTML("beforeend", [1, 2, 3, 4, 5, 6].map((p) => `<button data-p="${p}">${p}</button>`).join(""));
document.getElementById("o-q").insertAdjacentHTML("beforeend", TRY.map((t) => `<button data-q="${esc(t)}">${esc(t)}</button>`).join(""));
document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.p) go(+b.dataset.p);
  if (b.dataset.v) setAppearance(b.dataset.v);
  if (b.dataset.q != null) { S.q = b.dataset.q; S.hl = 0; S.picked = false; S.kind = null; S.folder = null; S.openF = null; S.open = true; if (S.p >= 4) S.view = "results"; if (S.p === 6) tokenize(true); frame(); }
});
setAppearance(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
frame();
</script>
</body>
