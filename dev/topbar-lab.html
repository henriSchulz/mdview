<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top bar lab</title>
<!-- Five proposals for the bar at the top of the window (sidebar, All Notes, the tabs, a new tab — and the toolbar at
     the right), side by side for choosing. The app's own colours and motion (motion.css, viewer.css); every bar can be
     tried: a tab is chosen by a click, shut by its x, a new one comes with +. Open the file in a browser:
         dev/topbar-lab.html            (?dark for the dark look)
     Not shipped. -->
<link rel="stylesheet" href="../motion.css">
<style id="theme"></style>
<link rel="stylesheet" href="../viewer.css">
<style>
  html { scrollbar-gutter: stable; }
  body { margin: 0; padding: 28px 32px 80px; font: 400 14px/1.5 var(--ui); color: var(--fg); background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
  .lab-head { display: flex; align-items: baseline; gap: 16px; max-width: 1180px; margin: 0 auto 22px; }
  .lab-head h1 { margin: 0; font-size: 20px; font-weight: 700; }
  .lab-head p { margin: 0; flex: 1; color: var(--fg2); }
  .lab-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill-hover); }
  .lab-seg button { height: 26px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--fg); font: inherit; font-size: 13px; cursor: default; transition: background-color var(--dur-fast) var(--ease-out); }
  .lab-seg button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 0 0 0.5px var(--line-strong), 0 1px 2px rgb(0 0 0 / 0.08); }
  .lab { max-width: 1180px; margin: 0 auto 26px; }
  .lab-name { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 8px; }
  .lab-name b { font-size: 15px; } .lab-name b i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 12px; }
  .lab-name span { color: var(--fg2); font-size: 13px; }
  /* a window, as much of it as the bar needs around it */
  .win { position: relative; height: 210px; border-radius: 14px; background: var(--bg); box-shadow: 0 0 0 0.5px var(--line-strong), 0 10px 30px rgb(0 0 0 / 0.1); overflow: hidden; }
  .bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 14px; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  .bar svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .grow { flex: 1; min-width: 12px; }
  .page { padding: 18px 0 0; max-width: 620px; margin: 0 auto; }
  .page h2 { margin: 0 0 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .page p { margin: 0 0 8px; height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--fg) 9%, transparent); }
  .page p:nth-child(3) { width: 92%; } .page p:nth-child(4) { width: 70%; } .page p:nth-child(5) { width: 84%; }
  button { font: inherit; color: inherit; }
  .x { display: grid; place-items: center; width: 18px; height: 18px; flex: none; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--fg2); opacity: 0; cursor: default; transition: opacity var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
  .bar .x svg { width: 11px; height: 11px; stroke-width: 2.2; }
  .t:hover .x, .t[aria-selected="true"] .x { opacity: 1; transition-duration: var(--dur-instant); }
  .x:hover { background: var(--fill-pressed); color: var(--fg); }
  .t { cursor: default; }
  .t .lbl { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t.enter { opacity: 0; scale: 0.96; }
  /* the toolbar at the right, as the app has it: one capsule */
  .tools { display: flex; align-items: center; gap: 2px; height: 38px; padding: 0 5px; border-radius: 19px; background: var(--glass, var(--bg)); box-shadow: var(--shadow-capsule); color: var(--fg2); }
  .tools button, .ic { display: grid; place-items: center; width: 34px; height: 30px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: inherit; cursor: default; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--spring-snappy-dur) var(--spring-snappy); }
  .tools button:hover, .ic:hover { background: var(--fill-hover); color: var(--fg); transition-duration: var(--dur-instant); }
  .tools button:active, .ic:active, .t:active { transform: scale(var(--press-scale, 0.97)); transition-duration: var(--dur-instant); }
  .tools .modes { display: flex; gap: 1px; margin: 0 3px; padding: 2px; border-radius: 15px; background: var(--fill-hover); }
  .tools .modes button { width: 32px; height: 26px; border-radius: 13px; }
  .tools .modes button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 0.5px var(--line-strong), 0 1px 2px rgb(0 0 0 / 0.1); }

  /* ---- A · One capsule: the left of the bar is what the right already is */
  .A .left { display: flex; align-items: center; gap: 2px; height: 38px; padding: 0 5px; min-width: 0; border-radius: 19px; background: var(--glass, var(--bg)); box-shadow: var(--shadow-capsule); color: var(--fg2); }
  .A .rule { width: 0.5px; height: 18px; margin: 0 4px; background: var(--line-strong); flex: none; }
  .A .list { position: relative; display: flex; gap: 2px; min-width: 0; }
  .A .t { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; height: 30px; width: 168px; min-width: 44px; flex: 0 1 auto; padding: 0 6px 0 10px; border: 0; border-radius: 15px; background: transparent; color: var(--fg2); font-size: 13px; transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out), scale var(--spring-smooth-dur) var(--spring-smooth); }
  .A .t:hover { background: var(--fill-hover); transition-duration: var(--dur-instant); }
  .A .t[aria-selected="true"] { color: var(--fg); font-weight: 500; background: transparent; }
  .A .glide { position: absolute; z-index: 0; top: 0; height: 30px; border-radius: 15px; background: color-mix(in srgb, var(--fg) 11%, transparent); transition: transform var(--spring-smooth-dur) var(--spring-smooth), width var(--spring-smooth-dur) var(--spring-smooth); }
  .A .ic { border-radius: 15px; }

  /* ---- B · A track with a lifted tab (Safari's compact tabs) */
  .B .ic { width: 38px; height: 34px; border-radius: 10px; color: var(--fg2); }
  .B .list { position: relative; display: flex; gap: 0; min-width: 0; flex: 0 1 auto; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .B .t { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 30px; width: 190px; min-width: 44px; flex: 0 1 auto; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; color: var(--fg2); font-size: 13px; transition: color var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out), scale var(--spring-smooth-dur) var(--spring-smooth); }
  .B .t + .t::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 0.5px; background: var(--line-strong); transition: opacity var(--dur-fast) var(--ease-out); }
  .B .t[aria-selected="true"]::before, .B .t[aria-selected="true"] + .t::before { opacity: 0; }
  .B .t[aria-selected="true"] { color: var(--fg); font-weight: 500; }
  .B .t .x { position: absolute; left: 6px; }
  .B .glide { position: absolute; z-index: 0; top: 3px; height: 30px; border-radius: 9px; background: var(--bg); box-shadow: 0 0 0 0.5px var(--line-strong), 0 1px 3px rgb(0 0 0 / 0.12); transition: transform var(--spring-smooth-dur) var(--spring-smooth), width var(--spring-smooth-dur) var(--spring-smooth); }
  body[data-mode="dark"] .B .glide { background: color-mix(in srgb, var(--fg) 16%, var(--bg)); }

  /* ---- C · Quiet: no plates, a line under the tab one is on */
  .C .bar { gap: 2px; box-shadow: inset 0 -0.5px 0 var(--line); }
  .C .ic { width: 36px; height: 32px; color: var(--fg2); }
  .C .list { position: relative; display: flex; gap: 2px; min-width: 0; height: 100%; margin-left: 8px; }
  .C .t { position: relative; display: flex; align-items: center; gap: 7px; height: 100%; width: 170px; min-width: 44px; flex: 0 1 auto; padding: 0 8px 0 10px; border: 0; background: transparent; color: var(--fg2); font-size: 13.5px; transition: color var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out); }
  .C .t::after { content: ""; position: absolute; inset: 10px 0; border-radius: 9px; background: var(--fill-hover); opacity: 0; z-index: -1; transition: opacity var(--dur-fast) var(--ease-out); }
  .C .t:hover::after { opacity: 1; transition-duration: var(--dur-instant); }
  .C .t[aria-selected="true"] { color: var(--fg); font-weight: 600; }
  .C .glide { position: absolute; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); transition: transform var(--spring-smooth-dur) var(--spring-smooth), width var(--spring-smooth-dur) var(--spring-smooth); }

  /* ---- D · The tab is the page's: it stands on it (a browser's tabs) */
  .D .win { background: color-mix(in srgb, var(--fg) 6%, var(--bg)); }
  .D .bar { align-items: flex-end; height: 50px; padding-bottom: 0; gap: 4px; }
  .D .ic { width: 36px; height: 32px; margin-bottom: 7px; color: var(--fg2); }
  .D .tools { margin-bottom: 6px; height: 36px; }
  .D .list { display: flex; gap: 2px; min-width: 0; margin-left: 6px; }
  .D .t { position: relative; display: flex; align-items: center; gap: 7px; height: 38px; width: 190px; min-width: 44px; flex: 0 1 auto; padding: 0 8px 2px 12px; border: 0; border-radius: 11px 11px 0 0; background: transparent; color: var(--fg2); font-size: 13px; transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out); }
  .D .t:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); transition-duration: var(--dur-instant); }
  .D .t[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 500; }
  /* (the foot of the tab runs out into the page) */
  .D .t[aria-selected="true"]::before, .D .t[aria-selected="true"]::after { content: ""; position: absolute; bottom: 0; width: 11px; height: 11px; background: radial-gradient(circle at 0 0, transparent 11px, var(--bg) 11.5px); }
  .D .t[aria-selected="true"]::before { left: -11px; } .D .t[aria-selected="true"]::after { right: -11px; transform: scaleX(-1); }
  .D .body { position: absolute; inset: 50px 0 0; background: var(--bg); }

  /* ---- E · Only the tab one is on has its name: the others are their signs */
  .E .ic { width: 36px; height: 34px; border-radius: 10px; color: var(--fg2); }
  .E .list { display: flex; gap: 4px; min-width: 0; margin-left: 4px; }
  .E .t { display: flex; align-items: center; gap: 0; height: 34px; width: 40px; flex: none; padding: 0 0 0 11.5px; box-sizing: border-box; border: 0; border-radius: 10px; background: color-mix(in srgb, var(--fg) 5%, transparent); color: var(--fg2); font-size: 13px; overflow: hidden; transition: width var(--spring-smooth-dur) var(--spring-smooth), background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out); }
  .E .t:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); transition-duration: var(--dur-instant); }
  .E .t .lbl { flex: 1; margin-left: 8px; text-align: left; opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
  .E .t .x { margin-right: 8px; }
  .E .t[aria-selected="true"] { width: 230px; background: color-mix(in srgb, var(--fg) 12%, transparent); color: var(--fg); font-weight: 500; }
  .E .t[aria-selected="true"] .lbl { opacity: 1; transition-delay: 60ms; }
  .E .t:not([aria-selected="true"]) .x { display: none; }
  .E .count { margin-left: 4px; color: var(--fg3, var(--fg2)); font-size: 12px; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .glide, .E .t { transition-duration: 0s !important; } }
</style>
<body data-mode="light">
<div class="lab-head">
  <h1>Top bar</h1>
  <p>Five ways the bar at the top could look. Click a tab, shut one with its ×, add one with +.</p>
  <span class="lab-seg" id="mode"><button type="button" data-m="light" aria-pressed="true">Light</button><button type="button" data-m="dark" aria-pressed="false">Dark</button></span>
</div>
<div id="labs"></div>
<script>
  const LIGHT = { background: "#f5f5f7", foreground: "#1d1d1f", accent: "#0071e3", muted: "#a1a1a6", red: "#d70015", green: "#248a3d", orange: "#c93400", yellow: "#a05a00", blue: "#0071e3", "bright-red": "#ff3b30" };
  const DARK = { background: "#1e1e20", foreground: "#f5f5f7", accent: "#0a84ff", muted: "#6e6e73", red: "#ff453a", green: "#32d74b", orange: "#ff9f0a", yellow: "#ffd60a", blue: "#0a84ff", "bright-red": "#ff6961" };
  const look = (m) => { document.body.dataset.mode = m; document.getElementById("theme").textContent = ":root{" + Object.entries(m === "dark" ? DARK : LIGHT).map(([k, v]) => `--c-${k}:${v}`).join(";") + "}"; for (const b of document.querySelectorAll("#mode button")) b.setAttribute("aria-pressed", String(b.dataset.m === m)); requestAnimationFrame(() => bars.forEach((b) => b.glide())); };
  const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const I = {
    side: svg('<rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M9.5 5v14"/>'),
    home: svg('<path d="M4.5 11 12 4.5 19.5 11"/><path d="M6.5 9.500V19h11V9.5"/><path d="M10 19v-5h4v5"/>'),
    note: svg('<path d="M7 3.500h7l4 4V19a1.5 1.5 0 0 1-1.5 1.500h-9.500A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.500z"/><path d="M14 3.500V8h4M9 12.500h6M9 16h4"/>'),
    plus: svg('<path d="M12 5.500v13M5.5 12h13"/>'),
    x: svg('<path d="m6.5 6.5 11 11M17.5 6.500l-11 11"/>'),
    list: svg('<path d="M9 7h10M9 12h10M9 17h10M5 7h.01M5 12h.01M5 17h.01"/>'),
    find: svg('<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>'),
    share: svg('<path d="M12 15V4.500M8 8l4-4 4 4M6 12.500V18a1.5 1.5 0 0 0 1.5 1.500h9A1.5 1.5 0 0 0 18 18v-5.5"/>'),
    code: svg('<path d="m9 8-4 4 4 4M15 8l4 4-4 4"/>'),
    pen: svg('<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/>'),
    read: svg('<path d="M12 6.500C10 5 7 4.5 4 5v13c3-.500 6 0 8 1.5 2-1.5 5-2 8-1.500V5c-3-.500-6 0-8 1.500zM12 6.500V19.5"/>'),
    panel: svg('<rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M14.5 5v14"/>'),
  };
  const TOOLS = `<div class="tools"><button title="Outline">${I.list}</button><button title="Find">${I.find}</button><button title="Share">${I.share}</button><span class="modes"><button title="Source" aria-pressed="false">${I.code}</button><button title="Write" aria-pressed="true">${I.pen}</button><button title="Read" aria-pressed="false">${I.read}</button></span><button title="Panel">${I.panel}</button></div>`;
  const NAMES = ["05 SSN", "Lecture Notes", "Reading list", "Weekend Trip", "Workout routine", "Ideas", "Commute thoughts"];
  const DESIGNS = [
    ["A", "One capsule", "The left side becomes what the right side already is: one glass capsule. The tab one is on has a plate that glides to it."],
    ["B", "A track, one tab lifted", "The tabs lie in a track, as wide as there is room; the one in hand is a lifted plate (as Safari's compact tabs). Its × sits at the left."],
    ["C", "Quiet", "No plates at all: names, and a line in the accent colour under the tab one is on. The bar is divided from the page by a hairline."],
    ["D", "The tab stands on the page", "The bar is tinted, the page is not: the tab in hand is a piece of the page (a browser's tabs)."],
    ["E", "Only one name", "Only the tab one is on shows its name; the others are their signs and open when chosen. Room for many tabs."],
  ];
  const bars = [];
  for (const [key, name, about] of DESIGNS) {
    const lab = document.createElement("section");
    lab.className = "lab " + key;
    lab.innerHTML = `<div class="lab-name"><b><i>${key}</i>${name}</b><span>${about}</span></div>` +
      `<div class="win"><div class="bar"></div><div class="body"><div class="page"><h2></h2><p></p><p></p><p></p><p></p></div></div></div>`;
    document.getElementById("labs").appendChild(lab);
    const bar = lab.querySelector(".bar"), title = lab.querySelector("h2");
    const side = `<button class="ic" title="Sidebar">${I.side}</button>`, home = `<button class="ic" title="All Notes">${I.home}</button>`, plus = `<button class="ic" data-new title="New tab">${I.plus}</button>`;
    const list = `<div class="list" role="tablist">${["A", "B", "C"].includes(key) ? '<i class="glide"></i>' : ""}</div>`;
    bar.innerHTML = key === "A" ? `<div class="left">${side}${home}<i class="rule"></i>${list}${plus}</div><span class="grow"></span>${TOOLS}`
      : key === "E" ? `${side}${home}${list}${plus}<span class="count"></span><span class="grow"></span>${TOOLS}`
      : `${side}${home}${list}${plus}<span class="grow"></span>${TOOLS}`;
    const host = bar.querySelector(".list"), glideEl = host.querySelector(".glide");
    let seq = 0, n = 3;
    const tab = (label) => { const t = document.createElement("button"); t.type = "button"; t.className = "t enter"; t.setAttribute("role", "tab"); t.setAttribute("aria-selected", "false"); t.innerHTML = `${I.note}<span class="lbl"></span><span class="x" role="button" title="Close tab">${I.x}</span>`; t.querySelector(".lbl").textContent = label; host.appendChild(t); requestAnimationFrame(() => t.classList.remove("enter")); return t; };
    const glide = () => { const t = host.querySelector('.t[aria-selected="true"]'); if (!glideEl) return; if (!t) { glideEl.style.width = "0"; return; } glideEl.style.width = t.offsetWidth + "px"; glideEl.style.transform = `translateX(${t.offsetLeft - (key === "B" ? 3 : 0) + (key === "B" ? 3 : 0)}px)`; };
    const choose = (t) => { for (const x of host.querySelectorAll(".t")) x.setAttribute("aria-selected", String(x === t)); title.textContent = t ? t.querySelector(".lbl").textContent : "All Notes"; const c = bar.querySelector(".count"); if (c) c.textContent = host.querySelectorAll(".t").length + " tabs"; glide(); if (key === "E") setTimeout(glide, 300); };
    host.addEventListener("click", (e) => {
      const t = e.target.closest(".t");
      if (!t) return;
      if (e.target.closest(".x")) { const was = t.getAttribute("aria-selected") === "true", next = t.nextElementSibling && t.nextElementSibling.classList.contains("t") ? t.nextElementSibling : [...host.querySelectorAll(".t")].filter((x) => x !== t).pop(); t.remove(); choose(was ? next || null : host.querySelector('.t[aria-selected="true"]')); return; }
      choose(t);
    });
    bar.querySelector("[data-new]").addEventListener("click", () => { const t = tab(NAMES[n++ % NAMES.length]); choose(t); });
    for (const m of bar.querySelectorAll(".modes button")) m.addEventListener("click", () => { for (const x of m.parentNode.children) x.setAttribute("aria-pressed", String(x === m)); });
    const first = [tab(NAMES[0]), tab(NAMES[1]), tab(NAMES[2])];
    bars.push({ glide });
    requestAnimationFrame(() => requestAnimationFrame(() => choose(first[0])));
  }
  addEventListener("resize", () => bars.forEach((b) => b.glide()));
  document.getElementById("mode").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) look(b.dataset.m); });
  look(location.search.includes("dark") ? "dark" : "light");
</script>
</body>
</html>
