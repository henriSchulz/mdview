# The tests, on every push and pull request: the editor's (dev/tests, in jsdom) and the shell's
# (cargo test). What needs a desktop — the rig, dev/rig.sh — is run by hand.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  page:
    name: editor and page (node)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: dev
        run: npm ci
      - working-directory: dev
        run: npm test
  shell:
    name: shell (cargo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: What the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - working-directory: src-tauri
        run: cargo test --locked
