# The app, built — the installers are what a release offers for download.
#
#   a tag v…      (git tag v0.2.0 && git push origin v0.2.0)  -> a release of that name, with the installers
#   by hand        (Actions › Build › Run workflow)             -> the installers as the run's artifacts
#
# Linux is what the app is written and tested on. Windows is built with it and is a file of the
# release too: its installer is started and asked on GitHub's Windows (system-probe.yml) — it is
# not signed, so Windows warns before it runs. macOS is tried: where it does not build, the run
# goes on without it — and what it builds is the run's artifact only, not a file of the release:
# an installer nobody has started, unsigned, is not offered for download.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # (the release, and its files)

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, bundles: "deb,rpm,appimage", tried: false }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm, bundles: "deb,rpm,appimage", tried: false }
          - { name: windows-x86_64, runner: windows-latest, bundles: "nsis", tried: false }
          - { name: macos-aarch64, runner: macos-latest, bundles: "dmg", tried: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.tried }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version that is built
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "the tag is $GITHUB_REF_NAME, Cargo.toml says $version"; exit 1; }
      - name: What the build needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config patchelf rpm file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installers
        working-directory: src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles "${{ matrix.bundles }}" --config ../packaging/bundle.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-notes-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && !matrix.tried
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,nsis/*.exe,dmg/*.dmg})
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Markdown Notes ${GITHUB_REF_NAME#v}" --generate-notes || true # (another job was first)
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
