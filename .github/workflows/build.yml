# The app, built — the installers are what a release offers for download.
#
#   a tag v…      (git tag v0.2.0 && git push origin v0.2.0)  -> a release of that name, with the installers
#   by hand        (Actions › Build › Run workflow)             -> the installers as the run's artifacts
#
# Linux is what the app is written and tested on. Windows is built with it and is a file of the
# release too — once its installer has been installed, started and asked on GitHub's Windows
# (the job after the build, dev/system-probe.ps1): what does not hold there is not released. It is
# not signed, so Windows warns before it runs. macOS is not built for now.
#
# A release's files are named by packaging/release-name.sh — MarkdownNotes-<version>-<system>-<arch>.<ext>,
# so that sorted by name they stand by system — and the release says above GitHub's notes which file
# is whose (packaging/release-notes.md; gh puts a --notes-file before the --generate-notes). The web
# app's download page (web/app/download) reads the latest release and offers its files.
#
# The app updates itself where it was installed from a downloaded file — the AppImage, the Windows
# installer (src-tauri/src/update.rs; a .deb or an .rpm only says that a newer one is there). For
# that each of the two is signed as it is built (bundle.createUpdaterArtifacts in
# packaging/bundle.json; the key in the secrets TAURI_SIGNING_PRIVATE_KEY and …_PASSWORD), its
# signature is a file of the release beside it (<file>.sig), and the last job writes latest.json
# from the signatures the release has — so it offers only what was released. The app reads it at
# releases/latest/download/latest.json. How the key came to be: packaging/updates.md.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # (the release, and its files)

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, bundles: "deb,rpm,appimage" }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm, bundles: "deb,rpm,appimage" }
          - { name: windows-x86_64, runner: windows-latest, bundles: "nsis" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version that is built
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "the tag is $GITHUB_REF_NAME, Cargo.toml says $version"; exit 1; }
      - name: What the build needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config patchelf rpm file xdg-utils
      - name: The updater's public key is in the app
        shell: bash
        run: |
          # (tauri.conf.json carries a placeholder until the key is made: an app built with it could never update)
          if grep -q 'UPDATER-PUBKEY-PLACEHOLDER' src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is still the placeholder — put in the content of ~/.tauri/mdview-updater.key.pub (packaging/updates.md)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installers
        working-directory: src-tauri
        shell: bash
        env:
          # (the AppImage and the Windows installer are signed with it, for the app's updates: <file>.sig beside each)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles "${{ matrix.bundles }}" --config ../packaging/bundle.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-notes-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows' # (the Windows installer: after it was tried, below)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p release
          for f in src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,appimage/*.AppImage.sig}; do
            name=$(bash packaging/release-name.sh "${GITHUB_REF_NAME#v}" "$f") # (a file it cannot name ends the step)
            cp "$f" "release/$name"
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Markdown Notes ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md --generate-notes || true # (another job was first)
          gh release upload "$GITHUB_REF_NAME" --clobber release/*

  # The Windows installer as someone who downloads it has it: installed, and started with the probe
  # in its page — once with a note (its colours, its pictures, a file handed over), once with a
  # folder (the sidebar). Only what holds there becomes a file of the release.
  windows-tried:
    name: the Windows installer, tried
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markdown-notes-windows-x86_64
          path: installer
      - name: Installed, started and asked
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse installer -Filter *.exe | Select-Object -First 1
          "the installer: $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          $exe = Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Include "mdview.exe", "Markdown Notes.exe" -Path "$env:LOCALAPPDATA", "$env:ProgramFiles" -Depth 3 | Select-Object -First 1
          if (-not $exe) { "the installer left no program"; exit 1 }
          ./dev/system-probe.ps1 -Exe $exe.FullName -Tag released -Setup -Strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tried
          path: |
            out
            *.log
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find installer -name '*.exe')
          [[ ${#files[@]} -gt 0 ]] || { echo "no installer to release"; exit 1; }
          mapfile -t -O "${#files[@]}" files < <(find installer -name '*.exe.sig') # (its signature, for the app's updates)
          mkdir -p release
          for f in "${files[@]}"; do
            name=$(bash packaging/release-name.sh "${GITHUB_REF_NAME#v}" "$f")
            cp "$f" "release/$name"
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Markdown Notes ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --clobber release/*

  # What the app's updater reads: latest.json, written from the signatures the release has once
  # both jobs that upload to it are done — the Windows installer's only where it was tried and
  # released. (After the Windows job, whatever became of it: the AppImages update all the same.)
  latest:
    name: latest.json
    needs: [build, windows-tried]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Written and released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          node packaging/latest-json.mjs "$GITHUB_REF_NAME" sigs > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" --clobber latest.json
