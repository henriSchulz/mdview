# Firebase App Hosting: how the app runs. One instance stays up (minInstances: an installed app opened after
# hours stood on a grey screen for the seconds an instance asleep takes to start — nothing can be shown before the
# server answers; it costs the idle instance, set it back to 0 to save that), and it runs as one instance at most: the token that renews a sign-in changes
# with every use, and must be renewed in one place. A project's pasteboard counts on it too: who
# waits for the next text is told by the instance it was written through (lib/paste.ts).
runConfig:
  minInstances: 1
  maxInstances: 1
  memoryMiB: 512

env:
  # the GitHub App's secret (the client id is no secret and stands in lib/github.ts), and the key
  # the session cookie is sealed with — both set with: firebase apphosting:secrets:set NAME
  - variable: GITHUB_CLIENT_SECRET
    secret: GITHUB_CLIENT_SECRET
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
  # the GitHub App's private key: with it notes can be shared under a link (docs/Teilen.md)
  - variable: GITHUB_APP_PRIVATE_KEY
    secret: GITHUB_APP_PRIVATE_KEY
